<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyCard">
<title>MyCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Unbounded:wght@600;700&display=swap">
<script>try{var T={black:'#000000',white:'#f2f2f7',blue:'#2443d4',red:'#ad1e28',violet:'#4a22b8',green:'#0f7552',rainbow:'#e0245e'},t=localStorage.getItem('mycard-theme');if(!T[t])t='black';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=T[t];document.documentElement.dataset.shape='cut'}catch(e){document.documentElement.dataset.theme='black'}</script>
<script src="./universal-cards.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
